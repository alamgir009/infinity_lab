<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Infinity Lab — Software Engineering Company</title>
    <meta name="description" content="Infinity Lab builds reliable software: full-stack web, backend & cloud architecture, and mobile apps. Established 2016." />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <script>
      /* Theme bootstrap — runs before first paint to prevent a flash of the
         wrong theme. Mirrors the logic of src/theme/useTheme.js.
         Binary light/dark; light is the default. */
      (function () {
        try {
          if (localStorage.getItem("il-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
