<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- Self-hosted faces: no third-party connection, no render blocking. -->
    <link
      rel="preload"
      href="/fonts/geist-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Infinity Lab — Software Engineering Company</title>
    <meta name="description" content="Infinity Lab builds reliable software: full-stack web, backend & cloud architecture, and mobile apps. Established 2016." />
    <meta name="theme-color" content="#F6F7F8" />
    <script>
      /* Theme bootstrap — runs before first paint to prevent a flash of the
         wrong theme. Mirrors the logic of src/theme/useTheme.js.
         Binary light/dark; light is the default. */
      (function () {
        try {
          var dark = localStorage.getItem("il-theme") === "dark";
          if (dark) document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#090a0e" : "#F6F7F8");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
